<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bags Forever">
  <title>Bags Forever</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33240f"/>
      <stop offset="1" stop-color="#0d0905"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="54%" r="55%">
      <stop offset="0" stop-color="#ffcf70" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#c88a2a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#c88a2a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c56b" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#7a5524" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f2c56b" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3415"/>
      <stop offset="0.38" stop-color="#b8743a"/>
      <stop offset="0.62" stop-color="#a5652f"/>
      <stop offset="1" stop-color="#4a2a10"/>
    </linearGradient>

    <radialGradient id="shade" cx="50%" cy="30%" r="75%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>

    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b3f1a"/>
      <stop offset="0.45" stop-color="#c98a4c"/>
      <stop offset="1" stop-color="#5a3415"/>
    </linearGradient>

    <linearGradient id="cord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c48a"/>
      <stop offset="1" stop-color="#8a6a36"/>
    </linearGradient>

    <radialGradient id="gold" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.5" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#a8761c"/>
    </radialGradient>
  </defs>

  <!-- fondo -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- destellos -->
  <g fill="#ffe3a0">
    <path d="M410 104 L 418 128 L 442 136 L 418 144 L 410 168 L 402 144 L 378 136 L 402 128 Z" fill-opacity="0.9"/>
    <path d="M104 362 L 109 377 L 124 382 L 109 387 L 104 402 L 99 387 L 84 382 L 99 377 Z" fill-opacity="0.7"/>
  </g>

  <!-- sombra en el suelo -->
  <ellipse cx="256" cy="418" rx="128" ry="18" fill="#000" fill-opacity="0.45"/>

  <!-- cuerpo de la bolsa -->
  <path d="M200 206 C 140 238, 116 312, 140 362 C 164 412, 348 412, 372 362 C 396 312, 372 238, 312 206 Z" fill="url(#leather)"/>
  <path d="M200 206 C 140 238, 116 312, 140 362 C 164 412, 348 412, 372 362 C 396 312, 372 238, 312 206 Z" fill="url(#shade)"/>
  <!-- costura -->
  <path d="M206 222 C 156 252, 138 316, 158 356 C 178 396, 334 396, 354 356 C 374 316, 356 252, 306 222" fill="none" stroke="#f0c98e" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="10 9" stroke-linecap="round"/>

  <!-- cuello fruncido -->
  <path d="M212 206 C 196 176, 184 140, 200 120 C 220 134, 236 138, 256 126 C 276 138, 292 134, 312 120 C 328 140, 316 176, 300 206 Z" fill="url(#top)"/>
  <g fill="none" stroke="#3a210c" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M232 202 C 226 178, 222 156, 228 134"/>
    <path d="M256 204 L 256 130"/>
    <path d="M280 202 C 286 178, 290 156, 284 134"/>
  </g>

  <!-- cordon -->
  <rect x="196" y="196" width="120" height="20" rx="10" fill="url(#cord)"/>
  <rect x="196" y="196" width="120" height="20" rx="10" fill="none" stroke="#5c4320" stroke-width="3"/>
  <path d="M244 214 C 232 236, 214 252, 204 274" fill="none" stroke="url(#cord)" stroke-width="8" stroke-linecap="round"/>
  <path d="M262 214 C 266 240, 256 262, 244 282" fill="none" stroke="url(#cord)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="204" cy="278" r="8" fill="#c9a463" stroke="#5c4320" stroke-width="3"/>
  <circle cx="244" cy="286" r="8" fill="#c9a463" stroke="#5c4320" stroke-width="3"/>
  <circle cx="253" cy="206" r="13" fill="url(#cord)" stroke="#5c4320" stroke-width="3"/>

  <!-- broche -->
  <circle cx="276" cy="318" r="34" fill="url(#gold)" stroke="#6b4a12" stroke-width="4"/>
  <circle cx="276" cy="318" r="22" fill="none" stroke="#8a611a" stroke-opacity="0.8" stroke-width="3"/>
  <path d="M276 302 L 282 318 L 276 334 L 270 318 Z" fill="#fff4c8" fill-opacity="0.85"/>
</svg>
